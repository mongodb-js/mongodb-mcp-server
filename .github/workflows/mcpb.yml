---
name: MCPB

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for permissions monitor
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Expose Python to permissions monitor's sudo PATH
        run: sudo -n ln -sf "$pythonLocation/bin/python3.12" /usr/local/bin/python3.12
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Validate manifest
        run: pnpm run validate:mcpb
      - name: Build .mcpb
        if: |
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-mcpb'))
        run: pnpm run build:mcpb
      - name: Upload .mcpb artifact
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-mcpb'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mongodb-mcp-server-mcpb
          path: dist-mcpb/*.mcpb
          if-no-files-found: error
