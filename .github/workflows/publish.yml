---
name: Publish
on:
  push:
    branches:
      - main
      - rmcp-ga-release

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      VERSION_EXISTS: ${{ steps.check-version.outputs.VERSION_EXISTS }}
      NPM_VERSION: ${{ steps.get-version.outputs.NPM_VERSION }}
      GIT_TAG_VERSION: ${{ steps.get-version.outputs.GIT_TAG_VERSION }}
      RELEASE_CHANNEL: ${{ steps.npm-tag.outputs.RELEASE_CHANNEL }}
      ATLAS_MCP_REMOTE_VERSION_EXISTS: ${{ steps.check-remote-version.outputs.ATLAS_MCP_REMOTE_VERSION_EXISTS }}
      ATLAS_MCP_REMOTE_NPM_VERSION: ${{ steps.get-remote-version.outputs.ATLAS_MCP_REMOTE_NPM_VERSION }}
      ATLAS_MCP_REMOTE_GIT_TAG_VERSION: ${{ steps.get-remote-version.outputs.ATLAS_MCP_REMOTE_GIT_TAG_VERSION }}
      ATLAS_MCP_REMOTE_RELEASE_CHANNEL: ${{ steps.remote-npm-tag.outputs.ATLAS_MCP_REMOTE_RELEASE_CHANNEL }}
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Get version
        id: get-version
        shell: bash
        run: |
          set -e

          NPM_VERSION=$(npm pkg get version --prefix packages/mongodb-mcp-server | tr -d '"')
          GIT_TAG_VERSION="v${NPM_VERSION}"
          echo "NPM_VERSION=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "GIT_TAG_VERSION=${GIT_TAG_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check if version already exists
        id: check-version
        shell: bash
        run: |
          set +e

          git rev-parse "${{ steps.get-version.outputs.GIT_TAG_VERSION }}" >/dev/null 2>&1
          if [[ $? -eq 0 ]]; then
            echo "VERSION_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Get npm tag
        id: npm-tag
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.get-version.outputs.GIT_TAG_VERSION }}"

          # Extract the release channel (latest, alpha, beta, rc)
          if [[ $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(.+))?$ ]]; then
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              CAPTURED_CHANNEL="${BASH_REMATCH[2]}"
              # The captured channel might have more dots, cases like
              # v1.2.3-alpha.1 For such cases we only want the channel relevant
              # part which is alpha.
              RELEASE_CHANNEL="${CAPTURED_CHANNEL%%.*}"
            else
              RELEASE_CHANNEL="latest"
            fi
          else
            echo "::error title=Invalid Version::Encountered unexpected version ${{ steps.get-version.outputs.GIT_TAG_VERSION }}, cannot proceed!"
            exit 1
          fi

          echo "RELEASE_CHANNEL=${RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"
      - name: Output deployment info
        run: echo "::notice title=Deployment Info::Deploying version ${{ steps.get-version.outputs.GIT_TAG_VERSION }} to channel ${{ steps.npm-tag.outputs.RELEASE_CHANNEL }}"
      - name: Get atlas-mcp-remote version
        id: get-remote-version
        shell: bash
        run: |
          set -e

          ATLAS_MCP_REMOTE_NPM_VERSION=$(npm pkg get version --prefix packages/mongodb-atlas-mcp-remote | tr -d '"')
          ATLAS_MCP_REMOTE_GIT_TAG_VERSION="mongodb-atlas-mcp-remote/v${ATLAS_MCP_REMOTE_NPM_VERSION}"
          echo "ATLAS_MCP_REMOTE_NPM_VERSION=${ATLAS_MCP_REMOTE_NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ATLAS_MCP_REMOTE_GIT_TAG_VERSION=${ATLAS_MCP_REMOTE_GIT_TAG_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check if atlas-mcp-remote version already exists
        id: check-remote-version
        shell: bash
        run: |
          set +e

          git rev-parse "${{ steps.get-remote-version.outputs.ATLAS_MCP_REMOTE_GIT_TAG_VERSION }}" >/dev/null 2>&1
          if [[ $? -eq 0 ]]; then
            echo "ATLAS_MCP_REMOTE_VERSION_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "ATLAS_MCP_REMOTE_VERSION_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Get atlas-mcp-remote npm tag
        id: remote-npm-tag
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.get-remote-version.outputs.ATLAS_MCP_REMOTE_NPM_VERSION }}"

          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(.+))?$ ]]; then
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              CAPTURED_CHANNEL="${BASH_REMATCH[2]}"
              ATLAS_MCP_REMOTE_RELEASE_CHANNEL="${CAPTURED_CHANNEL%%.*}"
            else
              ATLAS_MCP_REMOTE_RELEASE_CHANNEL="latest"
            fi
          else
            echo "::error title=Invalid Version::Encountered unexpected version ${VERSION}, cannot proceed!"
            exit 1
          fi

          echo "ATLAS_MCP_REMOTE_RELEASE_CHANNEL=${ATLAS_MCP_REMOTE_RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"
      - name: Output atlas-mcp-remote deployment info
        run: echo "::notice title=atlas-mcp-remote Deployment Info::Deploying version ${{ steps.get-remote-version.outputs.ATLAS_MCP_REMOTE_GIT_TAG_VERSION }} to channel ${{ steps.remote-npm-tag.outputs.ATLAS_MCP_REMOTE_RELEASE_CHANNEL }}"

  # Single approval gate for the whole release. The `Production` environment holds no
  # secrets, so it exists only to require a maintainer sign-off; keeping it on one job
  # means one approval per release instead of one per downstream job.
  approve-release:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [check]
    if: needs.check.outputs.VERSION_EXISTS == 'false' || needs.check.outputs.ATLAS_MCP_REMOTE_VERSION_EXISTS == 'false'
    environment: Production
    steps:
      - name: Confirm release
        run: echo "Approved ${{ needs.check.outputs.GIT_TAG_VERSION }} (channel ${{ needs.check.outputs.RELEASE_CHANNEL }})"

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - check
      - approve-release
    if: needs.check.outputs.VERSION_EXISTS == 'false'
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Publish to NPM
        run: pnpm -r publish --tag ${{ needs.check.outputs.RELEASE_CHANNEL }} --no-git-checks

      # mcpb install resolves @mongodb-js/mcp-* deps from the registry, so publish first.
      - name: Wait for workspace deps to be available on npm
        uses: ./.github/actions/wait-for-npm
        with:
          package-name: "@mongodb-js/mcp-core"
          package-version: ${{ needs.check.outputs.NPM_VERSION }}
      - name: Build .mcpb
        run: pnpm run build:mcpb

      - name: Generate AI release summary
        id: ai-summary
        continue-on-error: true
        env:
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm run generate:release-notes --newVersion ${{ needs.check.outputs.GIT_TAG_VERSION }} --commitSha ${{ github.sha }}

      - name: Publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          gh release create ${{ needs.check.outputs.GIT_TAG_VERSION }} \
            dist-mcpb/*.mcpb \
            --title "${{ needs.check.outputs.GIT_TAG_VERSION }}" \
            --notes-file "${{ steps.ai-summary.outputs.notes_file }}" \
            --target ${{ github.sha }} \
            ${{ (needs.check.outputs.RELEASE_CHANNEL != 'latest' && '--prerelease') || ''}}

      - name: Wait for package to be available on npm
        uses: ./.github/actions/wait-for-npm
        with:
          package-name: mongodb-mcp-server
          package-version: ${{ needs.check.outputs.NPM_VERSION }}

  upload-release-sbom:
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: needs.check.outputs.VERSION_EXISTS == 'false' && needs.check.outputs.RELEASE_CHANNEL == 'latest'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release dependency SBOM
        run: pnpm run create-dependency-sbom-lists

      - name: Configure AWS credentials for DevProd Platforms ECR
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEVPROD_PLATFORMS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload release SBOM to Kondukto via SilkBomb
        env:
          KONDUKTO_BRANCH: ${{ github.ref_name }}
          KONDUKTO_TOKEN: ${{ secrets.KONDUKTO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          ECR_HOST=901841024863.dkr.ecr.us-east-1.amazonaws.com
          SILKBOMB_IMAGE="${ECR_HOST}/release-infrastructure/silkbomb:2.0"

          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${ECR_HOST}"

          docker pull "${SILKBOMB_IMAGE}"

          docker run --rm \
            -e KONDUKTO_TOKEN \
            -v "$PWD":/pwd \
            "${SILKBOMB_IMAGE}" \
            augment \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$KONDUKTO_BRANCH" \
            --sbom-in /pwd/.sbom/sbom-prod.cyclonedx.json \
            --sbom-out /pwd/.sbom/sbom.json

      - name: Upload release SBOM artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-${{ needs.check.outputs.GIT_TAG_VERSION }}
          path: |
            .sbom/sbom-prod.cyclonedx.json
            .sbom/sbom.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  handle-sbom-failure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: [check, upload-release-sbom]
    if: ${{ failure() && needs.upload-release-sbom.result == 'failure' }}
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mongodb-js/devtools-shared/actions/setup-bot-token@d9b3431b50a916345471259794a44bd4533fcc58 # main
        id: app-token
        with:
          app-id: ${{ vars.DEVTOOLS_BOT_APP_ID }}
          private-key: ${{ secrets.DEVTOOLS_BOT_PRIVATE_KEY }}
      - name: Create SBOM failure issue
        uses: imjohnbo/issue-bot@3188c6ce06249206709d3b1f274d0d4c5a521601
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: Release SBOM upload failed for ${{ needs.check.outputs.GIT_TAG_VERSION }}
          body: |
            The release SBOM job failed after publication. Kondukto may still reflect an older release.

            - Version: ${{ needs.check.outputs.GIT_TAG_VERSION }}
            - Channel: ${{ needs.check.outputs.RELEASE_CHANNEL }}
            - Commit: ${{ github.sha }}
            - SBOM job result: ${{ needs.upload-release-sbom.result }}

            Investigate the failed step and rerun the failed jobs to upload the release SBOM.

            See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: "release_failure"

  docker-push:
    needs: [check, publish]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    with:
      npm_version: ${{ needs.check.outputs.NPM_VERSION }}
      release_channel: ${{ needs.check.outputs.RELEASE_CHANNEL }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  mcp-publish:
    needs: [check, docker-push]
    if: needs.check.outputs.VERSION_EXISTS == 'false' && needs.check.outputs.RELEASE_CHANNEL == 'latest'
    uses: ./.github/workflows/mcp-publish.yml
    permissions:
      id-token: write
      contents: read

  jira-release:
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: needs.check.outputs.VERSION_EXISTS == 'false' && needs.check.outputs.RELEASE_CHANNEL == 'latest'
    permissions: {}
    steps:
      - name: Update Jira release versions
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          VERSION_NUMBER: ${{ needs.check.outputs.NPM_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          JIRA_URL="https://jira.mongodb.org"
          PROJECT_KEY="MCP"
          TODAY=$(date -u +%Y-%m-%d)
          AUTH_HEADER="Authorization: Bearer ${JIRA_API_TOKEN}"

          # Fetch all project versions and find vNext
          versions=$(curl -sSf -H "${AUTH_HEADER}" "${JIRA_URL}/rest/api/2/project/${PROJECT_KEY}/versions")
          vnext_id=$(echo "${versions}" | jq -r '.[] | select(.name == "vNext") | .id')
          project_id=$(echo "${versions}" | jq -r '.[0].projectId')

          if [[ -z "${vnext_id}" ]]; then
            echo "::error::vNext version not found in Jira project ${PROJECT_KEY}"
            exit 1
          fi

          # Rename vNext to the release version and mark it as released
          curl -sSf -X PUT \
            -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
            -d "{\"name\": \"${VERSION_NUMBER}\", \"released\": true, \"releaseDate\": \"${TODAY}\"}" \
            "${JIRA_URL}/rest/api/2/version/${vnext_id}" > /dev/null
          echo "Renamed vNext to ${VERSION_NUMBER} and marked as released on ${TODAY}"

          # Create a new vNext version with start date today
          curl -sSf -X POST \
            -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
            -d "{\"name\": \"vNext\", \"projectId\": ${project_id}, \"startDate\": \"${TODAY}\"}" \
            "${JIRA_URL}/rest/api/2/version" > /dev/null
          echo "Created new vNext version with start date ${TODAY}"

  publish-atlas-mcp-remote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - check
      - approve-release
    # The `!= '0.0.0'` guard skips creating github release forthe placeholder version. `private: true` already makes the npm
    # publish a no-op. Both can be dropped after the first manual release, see https://jira.mongodb.org/browse/MCP-493
    if: needs.check.outputs.ATLAS_MCP_REMOTE_VERSION_EXISTS == 'false' && needs.check.outputs.ATLAS_MCP_REMOTE_NPM_VERSION != '0.0.0'
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter 'mongodb-atlas-mcp-remote' run compile
      - name: Publish to NPM
        run: pnpm --filter 'mongodb-atlas-mcp-remote' publish --tag ${{ needs.check.outputs.ATLAS_MCP_REMOTE_RELEASE_CHANNEL }} --no-git-checks

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.APIX_BOT_PAT || github.token }}
        shell: bash
        run: |
          set -e

          gh release create ${{ needs.check.outputs.ATLAS_MCP_REMOTE_GIT_TAG_VERSION }} \
            --title "${{ needs.check.outputs.ATLAS_MCP_REMOTE_GIT_TAG_VERSION }}" \
            --generate-notes \
            --target ${{ github.sha }} \
            ${{ (needs.check.outputs.ATLAS_MCP_REMOTE_RELEASE_CHANNEL != 'latest' && '--prerelease') || ''}}

      - name: Wait for package to be available on npm
        uses: ./.github/actions/wait-for-npm
        with:
          package-name: mongodb-atlas-mcp-remote
          package-version: ${{ needs.check.outputs.ATLAS_MCP_REMOTE_NPM_VERSION }}
