name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - labeled
      - synchronize

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run on PRs labeled `e2e-tests` (release PRs carry it), main pushes, or manual runs.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-tests')
    env:
      GROVE_API_KEY: ${{ secrets.AGENT_E2E_GROVE_API_KEY }}
      AGENT_E2E_MCP_CLIENT_ID: ${{ secrets.AGENT_E2E_MCP_CLIENT_ID }}
      AGENT_E2E_MCP_CLIENT_SECRET: ${{ secrets.AGENT_E2E_MCP_CLIENT_SECRET }}
      AGENT_E2E_MCP_BASE_URL: ${{ vars.AGENT_E2E_MCP_BASE_URL }}
      AGENT_E2E_ATLAS_CLIENT_ID: ${{ secrets.TEST_ATLAS_CLIENT_ID }}
      AGENT_E2E_ATLAS_CLIENT_SECRET: ${{ secrets.TEST_ATLAS_CLIENT_SECRET }}
      AGENT_E2E_ATLAS_BASE_URL: ${{ vars.TEST_ATLAS_BASE_URL }}
      AGENT_E2E_CODEX_MODEL: ${{ vars.AGENT_E2E_CODEX_MODEL }}
      AGENT_E2E_CLAUDE_MODEL: ${{ vars.AGENT_E2E_CLAUDE_MODEL }}
      AGENT_E2E_TUI_BACKEND: ${{ vars.AGENT_E2E_TUI_BACKEND }}

    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install codex CLI
        run: npm install -g @openai/codex && codex --version
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Run agent e2e tests
        # Drives codex + claude through tui-test's bundled headless terminal emulator.
        run: pnpm run test:e2e-tests
      - name: Upload agent e2e test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-test-report
          path: |
            coverage
          if-no-files-found: ignore
