name: Automatic Branch Pipeline Create

on:
  create:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  create-development-pipeline:
    if: (github.event.ref_type == 'branch' || github.event_name == 'workflow_dispatch') # only running if either it has been manually triggered  or a branch has been created
    runs-on: ubuntu-latest

    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Show branch
        shell: bash
        run: echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Explicitly references the branch ref to use its latest commit rather than the event commit SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: install-dependencies
        run: |
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.PKG_READ_TOKEN }}
          npm i -g corepack@latest
          corepack enable
          pnpm i

      # Updates the aws account here first
      - name: Extract dev account id
        id: get-dev-account-id
        run: |
          token=$(pnpm ts-node ./lib/pipeline-config.ts --accounts | jq -r '.aws.dev')
          echo "account_id=$token" >> $GITHUB_OUTPUT

      # Assume Role in -dev account
      - name: Configure AWS credentials from dev account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::${{ steps.get-dev-account-id.outputs.account_id }}:role/${{ github.event.repository.name }}-GitHubDeployRole
          aws-region: us-west-2

      # Perform CDK Deploy, after setting Github Token
      - name: cdk deploy pipeline-dev
        run: |
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.PKG_READ_TOKEN }}
          export GITBRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          npm i -g corepack@latest
          corepack enable
          pnpm i
          pnpm cdk deploy pipeline-dev --require-approval=never
