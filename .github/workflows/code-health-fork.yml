---
name: Code Health (fork)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    name: Run MongoDB tests
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node-version: ["22"]
        include:
          - os: ubuntu-24.04
            node-version: "24"
          - os: ubuntu-24.04
            node-version: "26"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        if: matrix.os == 'ubuntu-24.04'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        if: matrix.os == 'ubuntu-24.04'
        name: Setup Docker Environment
        with:
          set-host: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Run unit and Mongo integration tests
        run: pnpm exec vitest --project unit --project integration --project ui --project eslint-rules --run
  run-atlas-local-tests:
    name: Run Atlas Local tests
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pre-pull Atlas Local images
        run: |
          docker pull mongodb/mongodb-atlas-local:preview &
          docker pull mongodb/mongodb-atlas-local:latest &
          wait
      - name: Run atlas local tests
        run: pnpm exec vitest --project integration-atlas-local --run
