---
name: Checks
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check-style:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for permissions monitor
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Expose Python to permissions monitor's sudo PATH
        run: sudo -n ln -sf "$pythonLocation/bin/python3.12" /usr/local/bin/python3.12
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Run style check
        run: pnpm run check

  check-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for permissions monitor
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Expose Python to permissions monitor's sudo PATH
        run: sudo -n ln -sf "$pythonLocation/bin/python3.12" /usr/local/bin/python3.12
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - run: pnpm run generate

  check-dep:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for permissions monitor
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Expose Python to permissions monitor's sudo PATH
        run: sudo -n ln -sf "$pythonLocation/bin/python3.12" /usr/local/bin/python3.12
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Remove dev dependencies
        run: |
          rm -rf node_modules
          pnpm pkg set scripts.prepare="exit 0"
          pnpm install --prod --frozen-lockfile
      - name: List available tools
        run: pnpm dlx @modelcontextprotocol/inspector@2.14.0 --cli --method tools/list -- node packages/mongodb-mcp-server/dist/esm/index.js

  check-licenses:
    name: Check third-party notices
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for permissions monitor
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Expose Python to permissions monitor's sudo PATH
        run: sudo -n ln -sf "$pythonLocation/bin/python3.12" /usr/local/bin/python3.12
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Regenerating fails if licenses.json references a package that is no
      # longer a dependency or if a dependency uses a disallowed license, so
      # this surfaces config drift at PR time instead of during a release.
      - name: Regenerate third-party notices
        run: |
          pnpm run create-dependency-sbom-lists
          pnpm run update-third-party-notices
      - name: Check third-party notices are up to date
        # The generator stamps the current date; ignore it when comparing.
        run: |
          diff <(grep -v 'automatically generated on' THIRD_PARTY_NOTICES.md) \
               <(git show HEAD:THIRD_PARTY_NOTICES.md | grep -v 'automatically generated on')
